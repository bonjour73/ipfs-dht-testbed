ipfs_user: ipfs
ipfs_group: ipfs
ipfs_path: /var/lib/ipfs

kubo_version: "0.37.0"
kubo_arch: "linux-amd64"
kubo_archive: "kubo_v{{ kubo_version }}_{{ kubo_arch }}.tar.gz"
kubo_url: "https://dist.ipfs.tech/kubo/v{{ kubo_version }}/{{ kubo_archive }}"
kubo_checksum: ""

ipfs_api_addr: "/ip4/127.0.0.1/tcp/5001"
ipfs_gateway_addr: "/ip4/127.0.0.1/tcp/8080"

ipfs_swarm_addrs:
  - "/ip4/0.0.0.0/tcp/4001"
  - "/ip6/::/tcp/4001"
  - "/ip4/0.0.0.0/udp/4001/quic-v1"
  - "/ip6/::/udp/4001/quic-v1"
  - "/ip4/0.0.0.0/udp/4001/quic-v1/webtransport"
  - "/ip6/::/udp/4001/quic-v1/webtransport"

ipfs_static_peers: []
configure_ufw: true

install_browser_stack: false
browser_packages:
  - python3
  - python3-venv
  - chromium-browser
  - chromium-driver

curl_gateway_url: "http://127.0.0.1:8080"
selenium_gateway_url: "http://127.0.0.1:8080"
bench_request_timeout_seconds: 120
