# Small pilot inventory — validate the WHOLE pipeline on 3 cheap hosts before
# committing to the full 13× CCX63 run. Exercises every risky part end to end:

[seeders]
pilot_seeder ansible_host=<SEEDER_PUBLIC_IP> wg_ip=10.99.0.101 region=eu host_role=seeder node_count=5 host_subnet=10.60.1.0/24 run_bootstrap=1

# region=us here only so its containers are named node-us-* (distinct from the
# seeder host's node-eu-*), which makes eyeballing `docker ps` across hosts
# easier during the pilot. It's just a label; no geo behavior is implied.
[leechers]
pilot_leecher ansible_host=<LEECHER_PUBLIC_IP> wg_ip=10.99.0.102 region=us host_role=leecher node_count=5 host_subnet=10.60.2.0/24

[control]
pilot_control ansible_host=<CONTROL_PUBLIC_IP> wg_ip=10.99.0.103 region=eu host_role=control node_count=0 host_subnet=10.60.250.0/24

# Exactly one host runs the private bootstrap node (its first container).
[bootstrap_host]
pilot_seeder

[fleet:children]
seeders
leechers
control
